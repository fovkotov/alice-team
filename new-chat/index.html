<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Cherry Storm</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../gate.css" />
  </head>
  <body hidden>
    <main class="stage" aria-label="Cherry Storm — интерактивная композиция">
      <div class="media-layer" aria-hidden="true">
        <video id="hover-video" class="hover-media" src="media/hover-video.mp4" muted loop playsinline preload="auto"></video>
        <img id="hover-image-1" class="hover-media" src="media/hover-1.png" alt="" />
        <img id="hover-image-2" class="hover-media" src="media/hover-2.png" alt="" />
      </div>
      <canvas id="storm" aria-hidden="true"></canvas>
      <div class="grain" aria-hidden="true"></div>
      <img class="logo" src="media/logo.svg" alt="Cherry Storm" />
      <p class="caption">креативная практика<br />алисы ai</p>
    </main>
    <div class="scroll-space" aria-hidden="true"></div>
    <script type="module">
      import { requireAuth } from '../gate.js';
      await requireAuth();
      document.body.hidden = false;
      await import('./app.js');
    </script>
  </body>
</html>
